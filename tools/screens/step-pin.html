<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>step-pin</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 3420px;
        height: 1700px;
        overflow: hidden;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      :root {
        --page: #ffffff;
        --bar: #dee1e6;
        --bar-top: #ffffff;
        --text: #202124;
        --muted: #5f6368;
        --field: #f1f3f4;
        --menu: #ffffff;
        --menu-line: #dadce0;
        --shadow: 0 4px 16px rgb(60 64 67 / 28%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #202124;
          --bar: #202124;
          --bar-top: #292a2d;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --field: #303134;
          --menu: #292a2d;
          --menu-line: #3c4043;
          --shadow: 0 8px 28px rgb(0 0 0 / 55%);
        }
      }

      body {
        background: var(--page);
        color: var(--text);
      }

      .tabs {
        height: 38px;
        background: var(--bar);
        border-bottom: 1px solid var(--menu-line);
      }

      .nav {
        position: absolute;
        top: 38px;
        left: 0;
        right: 0;
        height: 58px;
        background: var(--bar-top);
        border-bottom: 1px solid var(--menu-line);
        z-index: 2;
      }

      .omnibox {
        position: absolute;
        left: 120px;
        top: 11px;
        width: 720px;
        height: 36px;
        border-radius: 18px;
        background: var(--field);
      }

      .tools {
        position: absolute;
        top: 11px;
        right: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .tool {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      .tool svg {
        width: 20px;
        height: 20px;
      }

      /* Marker target: puzzle center (3195, 127) from tab top = y 127 */
      .puzzle {
        position: absolute;
        left: 3195px;
        top: 127px;
        transform: translate(-50%, -50%);
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        color: var(--text);
        z-index: 5;
      }

      .puzzle svg {
        width: 20px;
        height: 20px;
      }

      .menu {
        position: absolute;
        left: 2778px;
        top: 311px;
        width: 376px;
        padding: 14px 0 10px;
        border: 1px solid var(--menu-line);
        border-radius: 12px;
        background: var(--menu);
        box-shadow: var(--shadow);
      }

      .menu-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px 10px;
        font-size: 15px;
        font-weight: 600;
      }

      .menu-note {
        padding: 0 16px 12px;
        font-size: 12px;
        line-height: 1.35;
        color: var(--muted);
      }

      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 0 12px 0 16px;
      }

      .row img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }

      .row .name {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .pin {
        position: absolute;
        left: 277px;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        color: var(--text);
      }

      .pin svg {
        width: 18px;
        height: 18px;
      }

      .manage {
        margin-top: 6px;
        padding: 10px 16px 4px;
        border-top: 1px solid var(--menu-line);
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="tabs"></div>
    <div class="nav">
      <div class="omnibox"></div>
      <div class="tools">
        <div class="tool">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8Z"
            />
          </svg>
        </div>
      </div>
    </div>

    <div class="puzzle">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M20.5 11H19V7.5A1.5 1.5 0 0 0 17.5 6H15V4.5a2.5 2.5 0 0 0-5 0V6H7.5A1.5 1.5 0 0 0 6 7.5V10H4.5a2.5 2.5 0 0 0 0 5H6v2.5A1.5 1.5 0 0 0 7.5 19H10v1.5a2.5 2.5 0 0 0 5 0V19h2.5a1.5 1.5 0 0 0 1.5-1.5V15h1.5a2.5 2.5 0 0 0 0-5ZM12 3.5a1 1 0 0 1 1 1V6h-2V4.5a1 1 0 0 1 1-1Z"
        />
      </svg>
    </div>

    <div class="menu">
      <div class="menu-head">
        <span>Extensions</span>
        <span style="color: var(--muted); font-weight: 400">×</span>
      </div>
      <p class="menu-note">
        No access needed. These extensions don't need to see and change
        information on this site.
      </p>
      <div class="row">
        <img src="../../assets/icon.svg" alt="" />
        <span class="name">Blur Image Online</span>
        <div class="pin">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2Z"
            />
          </svg>
        </div>
      </div>
      <div class="manage">⚙ Manage Extensions</div>
    </div>
  </body>
</html>
